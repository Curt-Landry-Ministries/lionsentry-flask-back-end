name: Build and Push Docker Images

on:
  push:
    branches:
      - test 
      - feature/docker-deployment

jobs:
  build_and_push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and Push App Server Image
        working-directory: backend/app_server
        run: |
          docker buildx build -t lionsentry/lionsentry-flask-back-end:app_server .
          docker push lionsentry/lionsentry-flask-back-end:app_server

      - name: Build and Push Auth Server Image
        working-directory: backend/auth_server
        run: |
          docker buildx build -t lionsentry/lionsentry-flask-back-end:auth_server .
          docker push lionsentry/lionsentry-flask-back-end:auth_server

      - name: Build and Push Email Server Image
        working-directory: backend/email_server
        run: |
          docker buildx build -t lionsentry/lionsentry-flask-back-end:email_server .
          docker push lionsentry/lionsentry-flask-back-end:email_server
