name: Build and Push Docker Images

on:
  push:
    branches:
      - test 
      - feature/docker-deployment

jobs:
  build_and_push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and Push App Server Image
        working-directory: backend/app_server
        run: |
          docker buildx build -t lionsentry/lionsentry-flask-back-end:app_server .
          docker push lionsentry/lionsentry-flask-back-end:app_server

      - name: Build and Push Auth Server Image
        working-directory: backend/auth_server
        run: |
          docker buildx build -t lionsentry/lionsentry-flask-back-end:auth_server .
          docker push lionsentry/lionsentry-flask-back-end:auth_server

      - name: Build and Push Email Server Image
        working-directory: backend/email_server
        run: |
          docker buildx build -t lionsentry/lionsentry-flask-back-end:email_server .
          docker push lionsentry/lionsentry-flask-back-end:email_server

  deploy_to_ec2:
    runs-on: ubuntu-latest

      steps:
        - name: Checkout code
          uses: actions/checkout@v2

        - name: Decrypt .cer file
          run: |
            openssl aes-256-cbc -d -in github-ci.cer.enc -out github-ci.cer -k ${{ secrets.EC2_GITHUB_CI }}
          
        - name: Connect to EC2
          run: |
            ssh -i "github-ci.cer" "${{ secrets.EC2_USER }}@${{ secrets.EC2_IP }}"

        - name: Connect to EC2
          run: |
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            sudo docker pull lionsentry/lionsentry-flask-back-end:app_server
            sudo docker pull lionsentry/lionsentry-flask-back-end:auth_server
            sudo docker pull lionsentry/lionsentry-flask-back-end:email_server