version: '3.4'
services:
  app_server:
    build: 
      context: .
      dockerfile: backend/app_server/Dockerfile
    ports:
      - "5001:5001"
    env_file:
      - ./backend/.env

  auth_server:
    build:
      context: .
      dockerfile: backend/auth_server/Dockerfile
    ports:
      - "5002:5002"
    env_file:
      - ./backend/.env


